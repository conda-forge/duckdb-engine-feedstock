schema_version: 1

context:
  name: duckdb-engine
  package_name: ${{ name | replace("-", "_") }}
  version: "0.15.0"

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ package_name }}/${{ package_name }}-${{ version }}.tar.gz
  sha256: 59f67ec95ebf9eb4dea22994664dfd34edce3c7416b862daa46da43f572ad6ef

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=${{ python_min }}
    - python-duckdb >=0.5.0
    - sqlalchemy >=1.3.22
    - packaging >=21.3

tests:
  - python:
      imports:
        - duckdb_engine
      pip_check: false
      python_version: ${{ python_min }}
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pyarrow
        - pytest >=8.0.0,<9
        - pytest-remotedata >=0.4.0,<0.5
        - hypothesis >=6.75.2,<7
        - pandas >=1,<2
        - snapshottest >=0.6.0,<0.7
    script:
      - pytest --pyargs duckdb_engine

about:
  license: MIT
  license_file: LICENSE.txt
  summary: SQLAlchemy driver for duckdb
  description: SQLAlchemy driver for duckdb
  homepage: https://github.com/Mause/duckdb_engine
  repository: https://github.com/Mause/duckdb_engine

extra:
  recipe-maintainers:
    - gforsyth
    - cpcloud
    - pavelzw
